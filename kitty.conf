# ==============================================================================
# PERFORMANCE & STARTUP SPEED TRIMS
# ==============================================================================
update_check_interval 0
shell                 /bin/zsh
scrollback_lines      10000
shell_integration     enabled

# ==============================================================================
# FONT SIZE & INIT LIGATURES (FONT INSTALLED VIA KITTY COMMANDS ITSELF)
# ==============================================================================
font_size        14.0
disable_ligatures always

# BEGIN_KITTY_FONTS
font_family      family="JetBrains Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# ==============================================================================
# WINDOW DECORATIONS & TAB PLACEMENT
# ==============================================================================
# Native GNOME titlebar is back on: gives you normal left-click drag/resize,
# no Super key needed. Trade-off: no seamless color blend between the OS
# titlebar and kitty's own bar, but you get proper window management back.

# hide_window_decorations no

# Tabs are drawn by kitty itself, independent of the titlebar setting above.
# This keeps them pinned under the native titlebar instead of at the bottom
# of the canvas.
tab_bar_edge            top
tab_bar_min_tabs        1
tab_bar_style           separator
tab_separator           "   "
tab_title_template      " {index}: {title} "

# ==============================================================================
# WINDOW SIZE
# ==============================================================================
remember_window_size  no
initial_window_width  100c
initial_window_height 28c

# ==============================================================================
# WINDOW BORDER
# ==============================================================================
window_margin_width 1
window_padding_width 1

draw_window_borders_for_single_window yes
window_border_width 1pt
active_border_color #1e1e2e
inactive_border_color #1e1e2e

# ==============================================================================
# BEHAVIOR
# ==============================================================================
copy_on_select       yes

# ==============================================================================
# KEYBOARD ACTIONS
# ==============================================================================
map ctrl+t             new_tab
map ctrl+w             close_tab
map ctrl+n             new_os_window
map ctrl+q             quit
map alt+enter          toggle_fullscreen

# ==============================================================================
# COLORS (OLED Black Custom Palette)
# ==============================================================================
background #000000
foreground #e0e6f5

selection_background #3b4261
selection_foreground #e0e6f5

# Tab bar coloring
active_tab_background   #1e1e2e
active_tab_foreground   #a7cfff
active_tab_font_style   bold
inactive_tab_background #1e1e2e
inactive_tab_foreground #737799
tab_bar_background      #1e1e2e

# ANSI Standard Palette
color0  #2b2d3f
color1  #b9474f
color2  #3fa24f
color3  #d6883d
color4  #4770c0
color5  #a46cc9
color6  #4ccac3
color7  #9da2ba

# ANSI Brights Palette
color8  #34364b
color9  #cb5e66
color10 #54be60
color11 #dea656
color12 #6182e0
color13 #bd84e6
color14 #70e6df
color15 #bbc1d8

